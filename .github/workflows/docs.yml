name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group docs
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify multi-vehicle view and framing
        run: node --test tests/showcase-geometry.test.mjs
      - name: Verify showcase production root and source data
        run: uv run python -m unittest discover -s tests -p test_showcase.py
      - run: uv run mkdocs gh-deploy --force
